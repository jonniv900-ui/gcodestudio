<!doctype html>
<meta charset="utf-8">
<title>FlowForge ícone/favicon regression</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1700px;height:900px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – ícone e favicon em Base64 (Salvar e Exportar HTML)</h3>
<p>Abra por um servidor local: <code>python -m http.server</code> na raiz do projeto e visite <code>/tests/project_icons_test.html</code>.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let passed=0,failed=0;
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+escHtml(name)+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+escHtml(name)+(detail!==undefined?'  → '+escHtml(JSON.stringify(detail)):'')+'\n');}
}
/* helpers that live in the test page */
function pngBlob(w,h,color){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle=color||'#3b82f6';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(w/4,h/4,w/2,h/2);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
const blobToDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function dims(url){return new Promise(r=>{const i=new Image();i.onload=()=>r([i.naturalWidth,i.naturalHeight]);i.onerror=()=>r([0,0]);i.src=url})}

async function run(){
  const f=document.getElementById('app');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  await sleep(600);
  let W,D;
  try{W=f.contentWindow;D=f.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  const $=s=>D.querySelector(s);
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());
  async function createProject(type){ /* "Novo" abre o assistente: é preciso clicar em "Criar projeto" */
    $('[data-new='+type+']').click();await sleep(250);
    if($('#siteWizardDlg')?.open)$('#wizCreate').click();
    await sleep(450);closeDialogs();
  }
  async function pick(inputSel,blobOrFile,name,type){
    const file=new W.File([blobOrFile],name,{type:type??blobOrFile.type});
    const dt=new W.DataTransfer();dt.items.add(file);
    const el=$(inputSel);el.files=dt.files;el.dispatchEvent(new W.Event('change',{bubbles:true}));
    await sleep(500);
  }
  const proj=k=>W.eval('project.'+k);
  const info=id=>$('#'+id).textContent;
  const thumb=id=>$('#'+id).parentElement.querySelector('.assetThumb');

  /* capture downloads */
  const downloads=[];
  W.showSaveFilePicker=undefined; /* force the plain-download fallback of saveWithDialog */
  W.HTMLAnchorElement.prototype.click=function(){downloads.push({name:this.download,href:this.href})};
  const lastText=async()=>{const d=downloads[downloads.length-1];return (await W.fetch(d.href)).text()};

  closeDialogs();await createProject('app');

  /* ---------- Salvar: ícone e favicon ---------- */
  W.openSaveDialog();await sleep(200);
  check('diálogo Salvar abre',$('#saveProjectDlg').open);

  await pick('#saveProjectIconFile',await pngBlob(400,400),'icon.png');
  const icon=proj('icon');
  check('ícone fica em Base64 (data:image/png)',/^data:image\/png;base64,/.test(icon),icon.slice(0,30));
  const di=await dims(icon);
  check('ícone grande é reduzido para 192 px',di[0]===192&&di[1]===192,di);

  await pick('#saveProjectFaviconFile',await pngBlob(300,150),'fav.png');
  const dfv=await dims(proj('favicon'));
  check('favicon é reduzido para 64 px mantendo a proporção',dfv[0]===64&&dfv[1]===32,dfv);

  const small=await pngBlob(32,32,'#ef4444');
  const smallUrl=await blobToDataUrl(small);
  await pick('#saveProjectFaviconFile',small,'small.png');
  check('imagem pequena é mantida byte a byte',proj('favicon')===smallUrl);

  check('descrição mostra formato, tamanho e Base64',/PNG/.test(info('saveProjectIconInfo'))&&/Base64/.test(info('saveProjectIconInfo')),info('saveProjectIconInfo'));
  check('descrição mostra dimensões 192×192',/192×192/.test(info('saveProjectIconInfo')),info('saveProjectIconInfo'));
  check('prévia (miniatura) é exibida',!!thumb('saveProjectIconInfo')&&!thumb('saveProjectIconInfo').hidden&&thumb('saveProjectIconInfo').src.startsWith('data:image/png'));
  await pick('#saveProjectFaviconFile',await pngBlob(300,150),'fav.png');
  check('aviso quando a imagem não é quadrada',/⚠/.test(info('saveProjectFaviconInfo')),info('saveProjectFaviconInfo'));
  const review=$('#saveReview').textContent;
  check('resumo do Salvar mostra formato e não despeja o Base64',/PNG/.test(review)&&review.length<400&&!review.includes('data:image'),review.slice(0,120));

  /* SVG, ICO sem MIME e arquivo inválido */
  await pick('#saveProjectFaviconFile','<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="16" height="16" fill="red"/></svg>','f.svg','image/svg+xml');
  check('SVG é incorporado como está',/^data:image\/svg\+xml;base64,/.test(proj('favicon')),proj('favicon').slice(0,30));
  await pick('#saveProjectFaviconFile',new Uint8Array([0,0,1,0,1,0,16,16,0,0,1,0,32,0,0,0,0,0,22,0,0,0]),'favicon.ico','');
  check('.ico sem MIME vira image/x-icon (não octet-stream)',/^data:image\/x-icon;base64,/.test(proj('favicon')),proj('favicon').slice(0,30));
  const before=proj('icon');
  await pick('#saveProjectIconFile','hello','a.txt','text/plain');
  check('arquivo inválido é recusado e não altera o projeto',proj('icon')===before);
  check('arquivo inválido mostra mensagem de erro',$('#ideMsgDlg')?.open===true);
  closeDialogs();W.openSaveDialog();await sleep(200);

  /* ---------- Usar Asset: vira Base64 reduzido ---------- */
  const bigUrl=await blobToDataUrl(await pngBlob(800,800,'#10b981'));
  W.eval(`project.assets=[{id:'asset-icon-test',name:'grande.png',type:'image/png',size:${bigUrl.length},data:${JSON.stringify(bigUrl)}}]`);
  W.eval("openProjectAssetPicker('favicon','saveProjectFaviconInfo')");
  await W.selectProjectAsset(W.eval('project.assets[0]'));await sleep(400);
  const fav=proj('favicon'),dfa=await dims(fav);
  check('Usar Asset grava Base64 (não o token asset://)',/^data:image\/png/.test(fav),fav.slice(0,30));
  check('Usar Asset reduz o favicon para 64 px',dfa[0]===64&&dfa[1]===64,dfa);
  closeDialogs();W.openSaveDialog();await sleep(200);

  /* ---------- Remover ---------- */
  $('#saveProjectIconClear').click();await sleep(200);
  check('Remover limpa o ícone',proj('icon')==='');
  check('Remover esconde a miniatura',thumb('saveProjectIconInfo').hidden);
  check('Remover mostra o texto de "nenhum ícone"',/(Nenhum ícone|No icon|Ningún icono)/.test(info('saveProjectIconInfo')),info('saveProjectIconInfo'));

  /* ---------- Salvar arquivo ---------- */
  await pick('#saveProjectIconFile',await pngBlob(512,512),'icon.png');
  $('#confirmSaveProject').click();await sleep(300);
  const saved=JSON.parse(await lastText());
  check('.flowmobile salvo contém ícone e favicon em Base64',/^data:image\//.test(saved.icon)&&/^data:image\//.test(saved.favicon),[String(saved.icon).slice(0,20),String(saved.favicon).slice(0,20)]);
  check('arquivo salvo tem nome .flowmobile',/\.flowmobile$/.test(downloads[downloads.length-1].name),downloads[downloads.length-1].name);

  /* ---------- Exportar HTML ---------- */
  closeDialogs();
  $('#exportBtn').click();await sleep(300);
  check('Exportar HTML abre o diálogo de ícone/favicon',$('#exportHtmlDlg').open);
  check('diálogo de exportação mostra o ícone já salvo',/Base64/.test(info('exportProjectIconInfo')),info('exportProjectIconInfo'));
  await pick('#exportProjectFaviconFile',await pngBlob(128,128,'#a855f7'),'novo.png');
  const dEx=await dims(proj('favicon'));
  check('favicon escolhido na exportação é reduzido e salvo no projeto',dEx[0]===64&&dEx[1]===64,dEx);
  $('#confirmExportHtml').click();await sleep(400);
  const html=await lastText();
  check('HTML exportado se chama index.html',downloads[downloads.length-1].name==='index.html',downloads[downloads.length-1].name);
  check('<link rel="icon"> com type e Base64',/<link rel="icon" type="image\/png" href="data:image\/png;base64,/.test(html));
  check('<link rel="apple-touch-icon"> em Base64',/<link rel="apple-touch-icon" href="data:image\/png;base64,/.test(html));
  check('<link rel="icon" sizes="192x192"> com type e Base64',/<link rel="icon" sizes="192x192" type="image\/png" href="data:image\/png;base64,/.test(html));
  check('HTML exportado não tem tokens asset://',!html.includes('asset://'));

  /* projeto antigo com token asset:// continua funcionando */
  W.eval("project.icon='asset://asset-icon-test'");
  closeDialogs();$('#exportBtn').click();await sleep(300);
  check('token asset:// legado é descrito como Asset',/Asset: grande\.png/.test(info('exportProjectIconInfo')),info('exportProjectIconInfo'));
  $('#confirmExportHtml').click();await sleep(400);
  const html2=await lastText();
  check('token asset:// legado é resolvido para Base64 na exportação',/rel="apple-touch-icon" href="data:image\/png;base64,/.test(html2)&&!html2.includes('asset://'));

  /* ---------- Idioma: a descrição não é sobrescrita ---------- */
  closeDialogs();W.openSaveDialog();await sleep(200);
  W.FlowForgeI18n.setLanguage('en');await sleep(300);
  check('trocar idioma mantém a descrição da imagem definida',/Base64/.test(info('saveProjectFaviconInfo')),info('saveProjectFaviconInfo'));
  $('#saveProjectFaviconClear').click();await sleep(200);
  check('texto vazio é traduzido (en)',info('saveProjectFaviconInfo')==='No favicon selected',info('saveProjectFaviconInfo'));
  W.FlowForgeI18n.setLanguage('es');await sleep(300);
  check('texto vazio é traduzido (es)',info('saveProjectFaviconInfo')==='Ningún favicon seleccionado',info('saveProjectFaviconInfo'));
  W.FlowForgeI18n.setLanguage('pt-BR');await sleep(200);

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+e.message+'\n');summary.textContent='Erro no teste';document.body.dataset.test='FAIL';});
</script>
