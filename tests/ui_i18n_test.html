<!doctype html>
<meta charset="utf-8">
<title>FlowForge UI i18n regression</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1700px;height:900px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – interface traduzida (painéis, diálogos, dicas e mensagens)</h3>
<p>Abra por um servidor local: <code>python -m http.server</code> na raiz do projeto e visite <code>/tests/ui_i18n_test.html</code>.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let passed=0,failed=0;
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+escHtml(name)+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+escHtml(name)+(detail!==undefined?'  → '+escHtml(JSON.stringify(detail)):'')+'\n');}
}
async function run(){
  const f=document.getElementById('app');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  await sleep(600);
  let W,D;
  try{W=f.contentWindow;D=f.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  const $=s=>D.querySelector(s);
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());
  async function createProject(type){
    $('[data-new='+type+']').click();await sleep(250);
    if($('#siteWizardDlg')?.open)$('#wizCreate').click();
    await sleep(450);closeDialogs();
  }
  const lang=async l=>{W.FlowForgeI18n.setLanguage(l);await sleep(300)};
  const labels=sel=>[...D.querySelectorAll(sel)].map(e=>e.textContent.trim());
  const select=async kind=>{W.eval(`addItem(${JSON.stringify(kind)});selected=ffItems().at(-1);render();props()`);await sleep(120)};
  const T=W.FlowForgeUIText;

  /* Every UI string of the editor (outside user content) in the current language. */
  function collect(rootSel){
    const root=D.querySelector(rootSel);const outp=new Set();
    if(!root)return [];
    const SKIP=T.skipSelector;
    (function walk(el){
      if(el.nodeType!==1||el.matches(SKIP))return;
      for(const a of ['placeholder','title','aria-label']){const v=el.getAttribute(a);if(v&&v.trim())outp.add(v.trim())}
      for(const n of el.childNodes){
        if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ').trim();if(t)outp.add(t)}
        else walk(n);
      }
    })(root);
    return [...outp];
  }
  /* strings the dictionary knows but that are shown in a different language than the selected one */
  const wrongLang=(strings,l)=>strings.filter(s=>{const tr=T.translate(s,null,l);return tr!=null&&tr.replace(/\s+/g,' ').trim()!==s.replace(/\s+/g,' ').trim()});

  await createProject('app');

  /* ---------- dictionary ---------- */
  check('dicionário sem conflitos (mesma frase para dois conceitos)',T.integrity().length===0,T.integrity());
  check('dicionário tem as 3 versões de cada frase',T.dictionary().every(e=>e.pt&&e.en&&e.es));

  /* ---------- painel de propriedades, por idioma ---------- */
  await select('input');
  await lang('pt-BR');
  let p=labels('#propertiesPanel label');
  check('pt-BR: rótulos em português (Nome, Largura, Altura, Fundo)',['Nome','Largura','Altura','Fundo'].every(x=>p.some(l=>l.startsWith(x))),p.slice(0,12));
  check('pt-BR: sem inglês solto (Name/Width/Height/Background/Visible/Enabled)',!p.some(l=>/^(Name|Width|Height|Background|Visible|Enabled)\b/.test(l)),p.filter(l=>/^(Name|Width|Height|Background|Visible|Enabled)\b/.test(l)));
  check('pt-BR: cabeçalho "Propriedades: Caixa de texto"',labels('#propDynamic h3, #propertiesPanel h3').some(t=>/^Propriedades: Caixa de texto$/i.test(t)),labels('#propertiesPanel h3'));
  await lang('en');
  p=labels('#propertiesPanel label');
  check('en: Name / Width / Height / Background',['Name','Width','Height','Background'].every(x=>p.some(l=>l.startsWith(x))),p.slice(0,12));
  check('en: cabeçalho "Properties: TextBox"',labels('#propertiesPanel h3').some(t=>/^Properties: TextBox$/i.test(t)),labels('#propertiesPanel h3'));
  check('en: campos dinâmicos traduzidos (Read only / Max length)',p.some(l=>l.startsWith('Read only'))&&p.some(l=>l.startsWith('Max length')),p);
  await lang('es');
  p=labels('#propertiesPanel label');
  check('es: Nombre / Ancho / Alto / Fondo',['Nombre','Ancho','Alto','Fondo'].every(x=>p.some(l=>l.startsWith(x))),p.slice(0,12));
  check('es: cabeçalho "Propiedades: Cuadro de texto"',labels('#propertiesPanel h3').some(t=>/^Propiedades: Cuadro de texto$/i.test(t)),labels('#propertiesPanel h3'));

  /* ---------- um novo componente já nasce traduzido (painel recriado) ---------- */
  await lang('en');
  await select('button');
  p=labels('#propertiesPanel label');
  check('componente selecionado depois do idioma já aparece traduzido',p.some(l=>l.startsWith('Text'))&&!p.some(l=>/^Texto\b/.test(l)),p.slice(0,10));

  /* ---------- cobertura: nenhum texto conhecido fica em outro idioma ---------- */
  const kinds=W.eval("[...new Set(Object.values(TOOL_GROUPS).flatMap(t=>t.map(x=>x[0])))]");
  for(const l of ['pt-BR','en','es']){
    await lang(l);
    const bad=new Set();
    for(const k of kinds){
      await select(k);
      wrongLang([...collect('#propertiesPanel'),...collect('#actionsPanel')],l).forEach(s=>bad.add(s));
    }
    ['header','#ideTools','#toolbox','#tabs','#ffEnhancementsPanel','#debuggerPanel','#blocksEditor'].forEach(sel=>wrongLang(collect(sel),l).forEach(s=>bad.add(s)));
    ['saveProjectDlg','exportHtmlDlg','newDlg','examplesDlg','siteWizardDlg','labelWysiwygDlg','ideMsgDlg'].forEach(id=>wrongLang(collect('#'+id),l).forEach(s=>bad.add(s)));
    check(`${l}: nenhum texto conhecido aparece em outro idioma (${kinds.length} componentes + painéis + diálogos)`,bad.size===0,[...bad].slice(0,8));
  }

  /* ---------- gaveta de páginas, árvore e seletores usam o nome traduzido do tipo ---------- */
  await lang('pt-BR');
  await select('input');
  $('#outlineBtn').click();await sleep(250);
  check('árvore (pt-BR) mostra "Caixa de texto: input1" em vez de "input: input1"',/Caixa de texto: input1/.test($('#drawerBody').textContent)&&!/(^|[^\w])input: input1/.test($('#drawerBody').textContent),$('#drawerBody').textContent.slice(0,200));
  $('#drawerClose').click();
  await lang('en');
  $('#outlineBtn').click();await sleep(250);
  check('árvore (en) mostra "TextBox: input1"',/TextBox: input1/.test($('#drawerBody').textContent),$('#drawerBody').textContent.slice(0,200));
  await lang('es');
  check('gaveta aberta é refeita ao trocar de idioma (es: "Cuadro de texto: input1")',/Cuadro de texto: input1/.test($('#drawerBody').textContent)&&$('#drawerTitle').textContent==='Árbol del proyecto',[$('#drawerTitle').textContent,$('#drawerBody').textContent.slice(0,120)]);
  $('#drawerClose').click();
  await lang('en');

  /* ---------- conteúdo do usuário nunca é traduzido ---------- */
  await lang('en');
  W.eval("project.pages[0].name='Código';render();renderPages()");await sleep(250);
  check('nome de página "Código" fica intacto na lista de páginas',labels('#pages .pageItem span').includes('Código'),labels('#pages .pageItem span'));
  check('...e no seletor de página',[...D.querySelectorAll('#projectPageTop option')].some(o=>o.textContent.includes('Código')),[...D.querySelectorAll('#projectPageTop option')].map(o=>o.textContent));
  check('...mas os botões da lista de páginas são traduzidos (Rename page)',[...D.querySelectorAll('#pages .pageRenameBtn')].every(b=>b.title==='Rename page'),[...D.querySelectorAll('#pages .pageRenameBtn')].map(b=>b.title));
  await select('label');
  W.eval("selected.text='Nome';selected.allowHtml=true;render();props()");await sleep(200);
  check('texto digitado pelo usuário no campo Texto não é traduzido',D.querySelector('#pText').value==='Nome',D.querySelector('#pText').value);
  check('texto do componente no palco não é traduzido',[...D.querySelectorAll('#stage *')].some(e=>e.textContent.trim()==='Nome'));
  $('#labelWysiwygOpen').click();await sleep(250);
  W.eval("document.querySelector('#labelWysiwygEditor').innerHTML='<p>Visível</p>'");
  await lang('es');
  check('conteúdo do editor WYSIWYG (contenteditable) não é traduzido',D.querySelector('#labelWysiwygEditor').textContent==='Visível',D.querySelector('#labelWysiwygEditor').textContent);
  check('...mas a barra do editor é traduzida (Izq. / Der.)',['Izq.','Der.'].every(x=>labels('#labelWysiwygDlg button').includes(x)),labels('#labelWysiwygDlg button').slice(0,18));
  closeDialogs();
  await lang('en');
  $('#labelWysiwygOpen').click();await sleep(250);
  check('en: botões do WYSIWYG (Left / Center / Right / Justify)',['Left','Center','Right','Justify'].every(x=>labels('#labelWysiwygDlg button').includes(x)),labels('#labelWysiwygDlg button').slice(0,18));
  closeDialogs();

  /* ---------- Dock (escopo) ---------- */
  await lang('pt-BR');
  check('pt-BR: opções do Dock em português',labels('#dockSelect option').join('|')==='Dock: nenhum|Superior|Inferior|Esquerda|Direita|Preencher',labels('#dockSelect option'));
  await lang('en');
  check('en: opções do Dock (Top/Bottom/Left/Right/Fill)',labels('#dockSelect option').slice(1).join('|')==='Top|Bottom|Left|Right|Fill',labels('#dockSelect option'));
  await lang('es');
  check('es: opções do Dock em espanhol',labels('#dockSelect option').slice(1).join('|')==='Arriba|Abajo|Izquierda|Derecha|Rellenar',labels('#dockSelect option'));

  /* ---------- textos desenhados por CSS no palco ---------- */
  const cssHint=()=>{const el=D.querySelector('#stage .component.selected');return el?W.getComputedStyle(el,'::after').content:null};
  await lang('pt-BR');await select('input');
  check('pt-BR: etiqueta do palco "duplo clique → ação"',cssHint()==='"duplo clique → ação"',cssHint());
  await lang('en');
  check('en: etiqueta do palco "double-click → action"',cssHint()==='"double-click → action"',cssHint());
  await lang('es');
  check('es: etiqueta do palco "doble clic → acción"',cssHint()==='"doble clic → acción"',cssHint());
  W.eval("addItem('button');document.querySelector('#selectionInfo').textContent='';");
  await lang('en');
  W.eval("document.querySelector('#selectionInfo').textContent='Adicionado: button9 • duplo clique abre button9_click()'");await sleep(150);
  check('en: mensagem de status "Added: … • double-click opens …"',$('#selectionInfo').textContent==='Added: button9 • double-click opens button9_click()',$('#selectionInfo').textContent);

  /* ---------- dicas (tooltips) da barra de ferramentas ---------- */
  await lang('en');
  check('en: tooltips Undo / Redo / Help',$('#undoBtn').title==='Undo'&&$('#redoBtn').title==='Redo'&&$('#helpBtn').title==='Help',[$('#undoBtn').title,$('#redoBtn').title,$('#helpBtn').title]);
  check('en: tooltips de alinhamento',$('#equalW').title==='Equal width'&&$('#zFront').title==='Bring to front',[$('#equalW').title,$('#zFront').title]);
  await lang('pt-BR');
  check('pt-BR: tooltips originais preservados',$('#undoBtn').title==='Desfazer'&&$('#helpBtn').title==='Ajuda',[$('#undoBtn').title,$('#helpBtn').title]);

  /* ---------- assistente de novo projeto ---------- */
  await lang('es');
  W.openSiteWizard('site');await sleep(250);
  check('es: título do assistente',$('#siteWizardTitle').textContent==='Nuevo Site — Configuración inicial',$('#siteWizardTitle').textContent);
  check('es: opções de navegação traduzidas',labels('#wizNavigation option').slice(0,3).join('|')==='Barra de navegación|Navegación inferior|Pestañas',labels('#wizNavigation option'));
  check('es: nomes de página sugeridos acompanham o idioma',$('#wizPageNames').value==='Inicio, Acerca de, Contacto',$('#wizPageNames').value);
  check('es: botão "Crear proyecto"',$('#wizCreate').textContent.trim()==='Crear proyecto',$('#wizCreate').textContent);
  closeDialogs();
  await lang('en');
  W.openSiteWizard('app');await sleep(250);
  check('en: título do assistente de App',$('#siteWizardTitle').textContent==='New App — Initial setup',$('#siteWizardTitle').textContent);
  check('en: nomes de página sugeridos para App',$('#wizPageNames').value==='Home, Screen 2',$('#wizPageNames').value);
  closeDialogs();

  /* ---------- mensagens e diálogos nativos ---------- */
  await lang('en');
  W.ideMessage('Projeto aberto','"Meu app" foi carregado com sucesso.');await sleep(250);
  check('en: ideMessage traduz título e mensagem (com parte dinâmica)',/Project opened/.test($('#ideMsgDlg').textContent)&&/"Meu app" was loaded successfully\./.test($('#ideMsgDlg').textContent),$('#ideMsgDlg').textContent.trim());
  closeDialogs();
  check('alert / confirm / prompt são interceptados',['alert','confirm','prompt'].every(n=>W[n].__ffI18n===true));
  check('t() traduz mensagens de diálogos nativos',T.t('Digite seu nome primeiro.','en')==='Type your name first.'&&T.t('Selecione um item.','es')==='Selecciona un elemento.');
  check('t() devolve o texto original quando desconhecido',T.t('Texto totalmente desconhecido 123','en')==='Texto totalmente desconhecido 123');

  /* ---------- salvar / exportar ---------- */
  await lang('en');
  W.openSaveDialog();await sleep(250);
  check('en: resumo do Salvar (Project: / Version: / File:)',/Project:/.test($('#saveReview').textContent)&&/Version:/.test($('#saveReview').textContent)&&/File:/.test($('#saveReview').textContent),$('#saveReview').textContent.slice(0,120));
  check('en: "Cor do tema" vira "Theme color"',labels('#saveProjectDlg label').some(t=>t.startsWith('Theme color')),labels('#saveProjectDlg label'));
  closeDialogs();

  /* ---------- voltar ao português restaura tudo (ida e volta) ---------- */
  await select('input');
  await lang('pt-BR');
  const before=labels('#propertiesPanel label').join('|');
  await lang('en');await lang('es');await lang('pt-BR');
  check('ida e volta en → es → pt-BR devolve exatamente os mesmos rótulos',labels('#propertiesPanel label').join('|')===before);

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+escHtml(e.message)+'\n');summary.textContent='Erro no teste';document.body.dataset.test='FAIL';});
</script>
