<!doctype html>
<meta charset="utf-8">
<title>FlowForge preview assets regression</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1700px;height:900px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – imagens (Base64/Assets) no Preview e na exportação</h3>
<p>Abra por um servidor local: <code>python -m http.server</code> na raiz do projeto e visite <code>/tests/preview_assets_test.html</code>.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const PNG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8z8BQz0AEYBxVSF+FABJADveWkH6oAAAAAElFTkSuQmCC';
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let passed=0,failed=0;
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+name+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+name+(detail!==undefined?'  → '+JSON.stringify(detail):'')+'\n');}
}
async function run(){
  const f=document.getElementById('app');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  await sleep(500);
  let W,D;
  try{W=f.contentWindow;D=f.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  const $=s=>D.querySelector(s);
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());
  async function createProject(type){ /* "Novo" abre o assistente: é preciso clicar em "Criar projeto" */
    $('[data-new='+type+']').click();await sleep(250);
    if($('#siteWizardDlg')?.open)$('#wizCreate').click();
    await sleep(450);closeDialogs();
  }
  const previewImgs=()=>[...$('#preview').contentDocument.querySelectorAll('img')].map(i=>i.complete&&i.naturalWidth>0);

  closeDialogs();await createProject('app');
  W.eval(`addItem('image');addItem('picturebox');
    project.assets=[{id:'asset-t1',name:'t.png',type:'image/png',size:1,data:${JSON.stringify(PNG)}}];
    ffItems().slice(-2).forEach(x=>{x.assetId='asset-t1';x.src='asset://asset-t1';x.srcType='asset'});render()`);
  await sleep(300);

  /* Aba Preview */
  $('#tabs [data-tab=preview]').click();await sleep(700);
  const imgs=previewImgs();
  check('aba Preview: Image e PictureBox renderizados',imgs.length===2&&imgs.every(Boolean),imgs);
  check('aba Preview: srcdoc sem tokens asset://',!$('#preview').srcdoc.includes('asset://'));

  /* Editar no Designer e voltar ao Preview atualiza o iframe */
  $('#tabs [data-tab=design]').click();await sleep(200);
  W.eval(`addItem('image');const x=ffItems().at(-1);x.assetId='asset-t1';x.src='asset://asset-t1';x.srcType='asset';render()`);
  $('#tabs [data-tab=preview]').click();await sleep(700);
  const imgs2=previewImgs();
  check('Preview atualiza após editar',imgs2.length===3&&imgs2.every(Boolean),imgs2);

  /* Depurador */
  $('#tabs [data-tab=design]').click();await sleep(200);
  $('#debugBtn').click();await sleep(900);
  const imgs3=previewImgs();
  check('Depurador: imagens renderizadas',imgs3.length===3&&imgs3.every(Boolean),imgs3);
  $('#debuggerPanel').hidden=true;

  /* Exportação (mesmo resolvedor) */
  const html=W.FlowForgeImageAssets.resolveHtml(W.generated());
  check('exportação: data URL presente e sem tokens',html.includes('data:image/png;base64,')&&!html.includes('asset://'));

  /* Token dentro de url(...) não engole o ")" */
  const css=W.FlowForgeImageAssets.resolveHtml('background:url(asset://asset-t1);color:red');
  check('url(asset://id) é resolvido sem consumir ")"',css.startsWith('background:url(data:image/png')&&css.endsWith(');color:red'),css.slice(-24));

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+e.message+'\n');summary.textContent='Erro no teste';document.body.dataset.test='FAIL';});
</script>
