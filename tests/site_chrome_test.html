<!doctype html>
<meta charset="utf-8">
<title>FlowForge site chrome regression</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1700px;height:900px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – header / navegação / footer automáticos (sem duplicidade)</h3>
<p>Abra por um servidor local: <code>python -m http.server</code> na raiz do projeto e visite <code>/tests/site_chrome_test.html</code>.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let passed=0,failed=0;
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+escHtml(name)+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+escHtml(name)+(detail!==undefined?'  → '+escHtml(JSON.stringify(detail)):'')+'\n');}
}
async function run(){
  const f=document.getElementById('app');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  await sleep(600);
  let W,D;
  try{W=f.contentWindow;D=f.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  const $=s=>D.querySelector(s);
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());
  async function createProject(type){
    $('[data-new='+type+']').click();await sleep(250);
    if($('#siteWizardDlg')?.open)$('#wizCreate').click();
    await sleep(450);closeDialogs();
  }
  async function openExample(name){
    const text=await (await fetch('../examples/'+name+'.flowmobile')).text();
    const dt=new W.DataTransfer();dt.items.add(new W.File([text],name+'.flowmobile',{type:'application/json'}));
    $('#fileInput').files=dt.files;$('#fileInput').dispatchEvent(new W.Event('change',{bubbles:true}));
    await sleep(800);closeDialogs();
  }
  /* per page: automatic chrome kinds, and how many headers / footers exist in total */
  const pages=()=>W.eval(`project.pages.map(p=>({name:p.name,
    auto:p.items.filter(i=>i.ffSystem==='siteChrome').map(i=>i.kind),
    headers:p.items.filter(i=>i.kind==='header').length,
    footers:p.items.filter(i=>i.kind==='footer').length,
    names:p.items.map(i=>i.name)}))`);
  const dupNames=ps=>ps.flatMap(p=>p.names.filter((n,i)=>p.names.indexOf(n)!==i));

  /* ---------- exemplos com header/footer próprios (siteLayout vazio) ---------- */
  for(const n of ['Landing_Page_Layout_Exemplo','Site_Landing_Pages_Layout_Exemplo']){
    await openExample(n);
    const ps=pages();
    check(`${n}: nenhuma página recebe chrome automático`,ps.every(p=>p.auto.length===0),ps.map(p=>[p.name,p.auto]));
    check(`${n}: exatamente 1 header e 1 footer por página`,ps.every(p=>p.headers===1&&p.footers===1),ps.map(p=>[p.name,p.headers,p.footers]));
    check(`${n}: nomes de componentes sem repetição na página`,dupNames(ps).length===0,dupNames(ps));
  }

  /* ---------- exemplos que dependem do chrome automático ---------- */
  for(const n of ['FlowForge_Site_Header_Nav_Footer_Exemplo','FlowForge_Landing_Header_Nav_Footer_Exemplo']){
    await openExample(n);
    const ps=pages();
    check(`${n}: cada página ganha header + navegação + footer`,ps.every(p=>p.auto.includes('header')&&p.auto.includes('navbar')&&p.auto.includes('footer')),ps.map(p=>[p.name,p.auto]));
    check(`${n}: 1 header e 1 footer por página`,ps.every(p=>p.headers===1&&p.footers===1),ps.map(p=>[p.name,p.headers,p.footers]));
  }

  /* ---------- assistente ---------- */
  await createProject('site');
  let ps=pages();
  check('assistente (Site): header + navegação + footer em todas as páginas',ps.length>=2&&ps.every(p=>p.auto.length===3),ps.map(p=>[p.name,p.auto]));
  W.prompt=()=>'Blog';$('#addPage').click();await sleep(450);
  ps=pages();
  check('"+ Nova página" já nasce com o chrome',ps.at(-1).name==='Blog'&&ps.at(-1).auto.length===3,ps.at(-1));
  W.eval('ensureSiteChrome(project);ensureSiteChrome(project);ensureSiteChrome(project)');
  const again=pages();
  check('ensureSiteChrome é idempotente (não acumula)',JSON.stringify(again.map(p=>p.auto))===JSON.stringify(ps.map(p=>p.auto)));

  /* ---------- projeto já salvo com duplicidade é curado ---------- */
  await openExample('Landing_Page_Layout_Exemplo');
  W.eval(`project.pages[0].items.unshift({id:'dupH',kind:'header',name:'siteHeader',ffSystem:'siteChrome',x:0,y:0,width:'100%',height:'72px',events:{}});
          project.pages[0].items.push({id:'dupF',kind:'footer',name:'siteFooter',ffSystem:'siteChrome',x:0,y:900,width:'100%',height:'90px',events:{}});
          ensureSiteChrome(project)`);
  ps=pages();
  check('duplicidade já gravada no arquivo é removida ao abrir/renderizar',ps[0].auto.length===0&&ps[0].headers===1&&ps[0].footers===1,ps[0]);

  /* ---------- projeto do assistente: header manual ---------- */
  await createProject('site');
  W.eval(`project.pages[0].items=project.pages[0].items.filter(i=>!(i.ffSystem==='siteChrome'&&i.kind==='header'));
          project.active=0;addItem('header');ensureSiteChrome(project)`);
  ps=pages();
  check('usuário troca o header automático por um manual: o automático não é recriado',ps[0].headers===1&&!ps[0].auto.includes('header'),ps[0]);
  await createProject('site');
  W.eval("project.active=0;addItem('header');ensureSiteChrome(project)");
  ps=pages();
  check('header manual ao lado do automático (escolha explícita): ambos permanecem',ps[0].headers===2,ps[0]);

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+escHtml(e.message)+'\n');summary.textContent='Erro no teste';document.body.dataset.test='FAIL';});
</script>
