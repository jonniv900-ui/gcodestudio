<!doctype html>
<meta charset="utf-8">
<title>FlowForge viewport regression</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1700px;height:900px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – regressão do viewport do Designer</h3>
<p>Abra esta página por um servidor local (iframes de <code>file://</code> não são acessíveis):
   <code>python -m http.server</code> na raiz do projeto e visite <code>/tests/viewport_test.html</code>.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let passed=0,failed=0;
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+name+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+name+(detail!==undefined?'  → '+JSON.stringify(detail):'')+'\n');}
}
async function run(){
  const f=document.getElementById('app');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  await sleep(500);
  let W,D;
  try{W=f.contentWindow;D=f.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  const $=s=>D.querySelector(s);
  const stage=()=>$('#stage');
  const sw=()=>parseFloat(stage().style.width);
  const sh=()=>parseFloat(stage().style.height);
  const rw=()=>Math.round(stage().getBoundingClientRect().width);
  const vpState=()=>W.eval('JSON.stringify(project.viewport)');
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());
  async function createProject(type){ /* "Novo" abre o assistente: é preciso clicar em "Criar projeto" */
    $('[data-new='+type+']').click();await sleep(250);
    if($('#siteWizardDlg')?.open)$('#wizCreate').click();
    await sleep(450);closeDialogs();
  }
  async function setSel(sel,value){const el=$(sel);el.value=value;el.dispatchEvent(new W.Event('change',{bubbles:true}));await sleep(350);}
  async function setNum(sel,value){const el=$(sel);el.value=value;el.dispatchEvent(new W.Event('change',{bubbles:true}));await sleep(350);}
  const st=()=>JSON.parse(vpState());

  closeDialogs();
  await createProject('app');

  /* 1. Novo App: padrão mobile */
  check('novo App começa em 390',sw()===390,sw());
  check('project.viewport gravado',st().width===390,vpState());

  /* 2. Bug original: com a classe ff-app-responsive o palco deve seguir o layout escolhido */
  check('palco tem ff-app-responsive',stage().classList.contains('ff-app-responsive'));
  await setSel('#viewport','768');
  check('Viewport 768 → largura definida',sw()===768,sw());
  check('Viewport 768 → largura renderizada (sem width:100% forçado)',rw()===768,rw());
  await setSel('#viewport','390');
  check('Viewport 390 → largura renderizada',rw()===390,rw());
  await setSel('#viewport','1200');
  check('Viewport 1200 → largura definida',sw()===1200,sw());

  /* 3. render() não perde o layout */
  await setSel('#viewport','768');
  W.render();await sleep(350);
  check('render() mantém o layout',sw()===768&&$('#viewport').value==='768',[sw(),$('#viewport').value]);

  /* 4. Presets de dispositivo e modo Livre */
  await setSel('#devicePreset','1440');
  check('preset Desktop → 1440',sw()===1440&&st().device==='1440',[sw(),vpState()]);
  await setSel('#devicePreset','');
  check('modo Livre segue o Viewport',sw()===1200&&st().device==='',[sw(),vpState()]);
  await setSel('#viewport','390');
  check('Livre: trocar Viewport não muda o seletor de dispositivo',$('#devicePreset').value==='',$('#devicePreset').value);
  check('opção "Livre" existe (qualquer idioma)',['Livre','Free','Libre'].includes($('#devicePreset').options[0].textContent.trim()),$('#devicePreset').options[0].textContent);

  /* 5. Largura × Altura personalizadas */
  await setNum('#viewportW','500');await setNum('#viewportH','700');
  check('largura personalizada 500',sw()===500,sw());
  check('altura personalizada 700',sh()===700,sh());
  check('Viewport mostra a opção "Outro" (largura fora dos presets)',$('#viewport').value==='custom',$('#viewport').value);
  check('dispositivo vai para Livre',$('#devicePreset').value==='',$('#devicePreset').value);
  check('tamanho personalizado é salvo',st().width===500&&st().height===700,vpState());
  await setNum('#viewportW','100');
  check('largura mínima = 280',sw()===280,sw());
  await setNum('#viewportW','5000');
  check('largura máxima = 1440',sw()===1440,sw());
  await setNum('#viewportH','50');
  check('altura mínima = 200',sh()===200,sh());
  await setSel('#devicePreset','390');
  check('preset devolve a altura do dispositivo',sw()===390&&sh()===844,[sw(),sh()]);
  await setSel('#devicePreset','');

  /* 6. Desfazer / refazer não trocam o layout */
  await setSel('#viewport','768');
  W.eval("snapshot();project.name='A';render()");W.eval("snapshot();project.name='B';render()");
  await setSel('#viewport','1200');
  $('#undoBtn').click();await sleep(350);
  check('desfazer preserva o layout',sw()===1200,sw());
  $('#redoBtn').click();await sleep(350);
  check('refazer preserva o layout',sw()===1200,sw());

  /* 7. Salvar → reabrir restaura o layout */
  await setSel('#viewport','768');
  const saved=W.eval('JSON.stringify(project)');
  await createProject('site');
  check('novo Site começa em 1200',sw()===1200,sw());
  const file=new W.File([saved],'t.flowmobile',{type:'application/json'});
  const dt=new W.DataTransfer();dt.items.add(file);
  $('#fileInput').files=dt.files;$('#fileInput').dispatchEvent(new W.Event('change',{bubbles:true}));
  await sleep(600);closeDialogs();
  check('reabrir projeto restaura Tablet 768',sw()===768&&W.eval('project.type')==='app',[sw(),W.eval('project.type')]);

  /* 8. Projeto antigo sem viewport usa o padrão do tipo */
  W.eval('delete project.viewport;render()');await sleep(350);
  check('projeto sem viewport → padrão do tipo (App = 390)',sw()===390,sw());

  /* 9. Trocar o tipo do projeto */
  await setSel('#projectType','site');
  check('tipo Site → 1200 e classe ff-site-layout',sw()===1200&&stage().classList.contains('ff-site-layout'),[sw(),stage().className]);

  /* 10. Breakpoints medem o palco */
  await setSel('#viewport','390');
  check('breakpoint mobile em 390',W.FFResponsive.current==='mobile',W.FFResponsive.current);
  await setSel('#viewport','768');
  check('breakpoint tablet em 768',W.FFResponsive.current==='tablet',W.FFResponsive.current);
  await setSel('#viewport','1200');
  check('breakpoint desktop em 1200',W.FFResponsive.current==='desktop',W.FFResponsive.current);
  await setNum('#viewportW','1000');
  check('breakpoint tablet em 1000 personalizado',W.FFResponsive.current==='tablet',W.FFResponsive.current);
  check('FFResponsive.width acompanha o palco',W.FFResponsive.width===1000,W.FFResponsive.width);

  /* 11. Painel Recursos usa o mesmo módulo */
  $('#ffEnhancementsBtn').click();
  $('[data-ff-v="390"]').click();await sleep(350);
  check('painel Recursos → Mobile',sw()===390&&W.FFResponsive.current==='mobile',[sw(),W.FFResponsive.current]);

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+e.message+'\n');summary.textContent='Erro no teste';document.body.dataset.test='FAIL';});
</script>
